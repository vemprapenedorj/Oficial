<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/imagens/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/imagens/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/imagens/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/imagens/icons/icon-512.png" />
    <link rel="mask-icon" href="/assets/imagens/icons/safari-pinned-tab.svg" color="#064e3b" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/imagens/icons/apple-touch-icon.png" />

    <!-- The LCP image is discovered before JavaScript and matches picture's AVIF source. -->
    <link rel="preload" as="image" href="/assets/imagens/hero-mobile.avif" type="image/avif" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/imagens/hero-tablet.avif" type="image/avif" media="(min-width: 768px) and (max-width: 1279px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/imagens/hero-desktop.avif" type="image/avif" media="(min-width: 1280px)" fetchpriority="high" />

    <!-- DNS prefetch for the analytics script that is loaded after the initial content. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Google Consent Mode v2: default seguro antes do GTM -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
    <!-- Google Tag Manager: ativo somente no domínio oficial -->
    <script>
      var analyticsHostname = window.location.hostname;
      var isOfficialHostname = analyticsHostname === 'vemprapenedo.com.br'
        || analyticsHostname === 'www.vemprapenedo.com.br';
      if (isOfficialHostname) {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-TTVH4RFS');
      }
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
